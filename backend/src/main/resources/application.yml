spring:
  application:
    name: terra-creaciones
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/terra}
    username: ${DB_USER:terra}
    password: ${DB_PASSWORD:terra}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
    expiration-hours: 24
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  uploads-dir: ${UPLOADS_DIR:uploads}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
